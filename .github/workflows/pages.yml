name: Deploy to GitHub Pages

# Builds the Forma web app (SolidCraft's browser build, served at /forma/) and
# Artea Studio (served at the root, studio.artea.ro) and pushes the static site
# to the gh-pages branch, which GitHub Pages serves under the custom domain.

on:
  push:
    branches: [main]
    paths-ignore: ["tests/**", "docs/**", "examples/**", "packaging/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # --- Forma web app (Rust → wasm, trunk) ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the web app
        working-directory: apps/solidcraft-web
        run: trunk build --release --public-url /forma/

      # --- Artea Studio (TypeScript, legacy-ts/) ---
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: legacy-ts/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Artea Studio
        working-directory: legacy-ts
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @forma/core build
          BASE_PATH=/ pnpm --filter artea-studio build

      - name: Assemble the site
        run: |
          mkdir -p site/forma
          cp -r legacy-ts/apps/artea-studio/dist/. site/
          cp -r dist/web/. site/forma/
          touch site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: studio.artea.ro
          force_orphan: true
