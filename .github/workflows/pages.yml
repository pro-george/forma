name: Deploy to GitHub Pages

# Builds Artea Studio (served at the root, studio.artea.ro) and Forma Studio
# (/forma/) and pushes the static site to the gh-pages branch, which GitHub
# Pages serves under the custom domain below.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build Studio and Artea Studio
        run: |
          BASE_PATH=/ pnpm -r build
          mkdir -p site/forma
          cp -r apps/artea-studio/dist/. site/
          cp -r apps/studio/dist/. site/forma/
          touch site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: studio.artea.ro
          force_orphan: true
