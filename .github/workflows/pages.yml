name: Deploy to GitHub Pages

# Builds Studio (served at /forma/) and Artea Studio (/forma/artea/) and
# pushes the static site to the gh-pages branch, which GitHub Pages serves.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Build Studio and Artea Studio
        run: |
          BASE_PATH=/${{ github.event.repository.name }}/ pnpm -r build
          mkdir -p site/artea
          cp -r apps/studio/dist/. site/
          cp -r apps/artea-studio/dist/. site/artea/
          touch site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
