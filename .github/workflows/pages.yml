name: Deploy to GitHub Pages

# Builds the Forma web app (served at /forma/) and Artea Studio (served at the root) and
# publishes them as studio.artea.ro. The site is handed to GitHub Pages as a build artifact
# (Settings → Pages → Source = GitHub Actions), not pushed to a gh-pages branch: the web app's
# wasm file is over the 100 MB a git push accepts. The custom domain is the one set in
# Settings → Pages.

on:
  push:
    branches: [forma-next]
    paths-ignore: ["tests/**", "docs/**", "packaging/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # --- Forma web app (Rust → wasm, trunk) ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the web app
        working-directory: apps/solidcraft-web
        run: trunk build --release --public-url /forma/

      # --- Artea Studio (TypeScript, legacy-ts/) ---
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: legacy-ts/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Artea Studio
        working-directory: legacy-ts
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @forma/core build
          BASE_PATH=/ pnpm --filter artea-studio build

      - name: Assemble the site
        run: |
          mkdir -p site/forma
          cp -r legacy-ts/apps/artea-studio/dist/. site/
          cp -r dist/web/. site/forma/
          # Forma's ready-made designs, opened with ?open=/forma/designs/<name>.sc
          mkdir -p site/forma/designs
          for d in examples/forma/*/; do
            n=$(basename "$d"); [ -f "$d/$n.sc" ] && cp "$d/$n.sc" "site/forma/designs/$n.sc"
          done
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
