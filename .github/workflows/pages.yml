name: Deploy to GitHub Pages

# Builds the Forma web app (served at the root) and Artea Studio (served at /lampi/) and
# publishes them as studio.artea.ro. /forma/, the app's address until November 2026, redirects
# to the root. The site is handed to GitHub Pages as a build artifact
# (Settings → Pages → Source = GitHub Actions), not pushed to a gh-pages branch: the web app's
# wasm file is over the 100 MB a git push accepts. The custom domain is the one set in
# Settings → Pages.

on:
  push:
    branches: [forma-next]
    paths-ignore: ["tests/**", "docs/**", "packaging/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # --- Forma web app (Rust → wasm, trunk) ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Install trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the web app
        working-directory: apps/solidcraft-web
        # Optimised for size ("s"), not speed (the workspace's 3): the wasm file is what a first
        # visit waits for. Measured on v0.43: 176 MB (55 MB gzipped) at 3, 117 MB (38 MB) at "s",
        # 106 MB (34 MB) at "z"; replaying the KUMO base's commands took 102 s, 112 s and 151 s.
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: s
        run: trunk build --release --public-url /

      # --- Artea Studio (TypeScript, legacy-ts/) ---
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: legacy-ts/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Artea Studio
        working-directory: legacy-ts
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @forma/core build
          BASE_PATH=/lampi/ pnpm --filter artea-studio build

      - name: Assemble the site
        run: |
          mkdir -p site/lampi site/designs site/forma/designs
          cp -r dist/web/. site/
          cp -r legacy-ts/apps/artea-studio/dist/. site/lampi/
          # Forma's ready-made designs, opened with ?open=/designs/<name>.sc. The copy under
          # /forma/ keeps links made before the move working.
          for d in examples/forma/*/; do
            n=$(basename "$d")
            if [ -f "$d/$n.sc" ]; then
              cp "$d/$n.sc" "site/designs/$n.sc"
              cp "$d/$n.sc" "site/forma/designs/$n.sc"
            fi
          done
          # The old address: a redirect to the root, and the app's service worker unbuilt, which
          # makes the worker a browser kept for /forma/ drop its files and unregister.
          cp deploy/forma-moved/index.html site/forma/index.html
          cp apps/solidcraft-web/sw.js site/forma/sw.js
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
