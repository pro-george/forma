name: Check forma-next

# Builds the Forma web app from the forma-next branch (the SolidCraft v0.43 fork with Forma's own
# kit, look and brand) and keeps the result as a downloadable artifact. Nothing is deployed:
# studio.artea.ro is only published by pages.yml, from main and main-sc.

on:
  push:
    branches: [forma-next]
    paths-ignore: ["tests/**", "docs/**", "packaging/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forma-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14

jobs:
  look:
    name: Themes and icons
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: look
      # Every built-in theme file reads (the two Artea themes among them) and every icon master parses.
      - run: cargo test -p solidcraft-look

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: web
      - name: Install trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the web app
        working-directory: apps/solidcraft-web
        run: trunk build --release --public-url /forma/
      - name: Add the ready-made designs
        run: |
          mkdir -p dist/web/designs
          for d in examples/forma/*/; do
            n=$(basename "$d"); [ -f "$d/$n.sc" ] && cp "$d/$n.sc" "dist/web/designs/$n.sc"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: forma-web
          path: dist/web
          retention-days: 14
