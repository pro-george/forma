name: Check forma-next

# Quick checks on forma-next beside the deploy (pages.yml builds and publishes the web app).

on:
  push:
    branches: [forma-next]
    paths-ignore: ["tests/**", "docs/**", "packaging/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forma-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  look:
    name: Themes and icons
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: look
      # Every built-in theme file reads (the two Artea themes among them) and every icon master parses.
      - run: cargo test -p solidcraft-look
